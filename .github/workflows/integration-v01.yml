name: SIDRA AI v0.1 Integration Gate

on:
  push:
    branches:
      - integration/v0.1-candidate
  pull_request:
    branches:
      - integration/v0.1-candidate

permissions:
  contents: read

concurrency:
  group: sidra-v01-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Same-SHA offline verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact source SHA without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout matches event source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected source SHA $EXPECTED_SHA but checked out $actual_sha" >&2
            exit 1
          fi
          echo "Verified source SHA: $actual_sha"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install verification dependencies
        run: python -m pip install -e ".[dev]"

      - name: Reject installed external LLM provider SDKs
        shell: bash
        run: |
          python - <<'PY'
          from importlib.metadata import distributions

          blocked = {
              "anthropic",
              "cohere",
              "fireworks-ai",
              "google-generativeai",
              "google-genai",
              "groq",
              "litellm",
              "mistralai",
              "openai",
              "together",
          }
          installed = {
              (dist.metadata.get("Name") or "").strip().lower().replace("_", "-")
              for dist in distributions()
          }
          found = sorted(blocked & installed)
          if found:
              raise SystemExit(
                  "External LLM provider SDKs are installed in the v0.1 verification graph: "
                  + ", ".join(found)
              )
          print("No blocked external LLM provider SDK is installed.")
          PY

      - name: Run full offline pytest suite
        env:
          SIDRA_MODEL_BACKEND: echo
          SIDRA_HOST: 127.0.0.1
        run: python -m pytest

      - name: Run security and zero-cost evals
        env:
          SIDRA_MODEL_BACKEND: echo
          SIDRA_HOST: 127.0.0.1
        run: sidra-evals

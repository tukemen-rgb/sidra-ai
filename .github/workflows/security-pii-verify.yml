name: SIDRA Security PII Verification

on:
  push:
    branches:
      - agent/security-pii-medium-verify-20260816

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Security gate tests
        env:
          SIDRA_MODEL_BACKEND: echo
          SIDRA_API_HOST: 127.0.0.1
        run: python -m pytest tests/test_security_gate.py tests/test_data_not_instructions.py

      - name: Run full offline suite
        env:
          SIDRA_MODEL_BACKEND: echo
          SIDRA_API_HOST: 127.0.0.1
        run: python -m pytest

      - name: Run security and cost evals
        env:
          SIDRA_MODEL_BACKEND: echo
          SIDRA_API_HOST: 127.0.0.1
        run: sidra-evals
